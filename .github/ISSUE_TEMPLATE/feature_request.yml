name: Idea / feature request
description: Suggest something new for Diamond Vending
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What's the idea?
      description: What would you like the vending machine to do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it help?
      description: What problem does it solve, or what would it make more fun?
